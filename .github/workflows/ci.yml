# Intégration continue : format, lint, typecheck, tests, build à chaque push et pull request.
# Actions épinglées par SHA de commit (chaîne d'approvisionnement) ; version en commentaire.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dz
          POSTGRES_PASSWORD: dz
          POSTGRES_DB: dz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dz -d dz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Identifiants de la base éphémère de CI : pas des secrets.
      DATABASE_URL: postgresql://dz:dz@localhost:5432/dz_test
      DATABASE_URL_TEST: postgresql://dz:dz@localhost:5432/dz_test
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer pnpm (version de packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Installer Node (version de .nvmrc) avec cache pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances (lockfile figé)
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E admin (Playwright, API + base réelles)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dz
          POSTGRES_PASSWORD: dz
          POSTGRES_DB: dz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dz -d dz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Identifiants de la base éphémère de CI : pas des secrets.
      DATABASE_URL_TEST: postgresql://dz:dz@localhost:5432/dz_test
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer pnpm (version de packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Installer Node (version de .nvmrc) avec cache pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances (lockfile figé)
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm db:generate

      - name: Installer Chromium (version épinglée de Playwright)
        run: pnpm --filter @dz/admin exec playwright install --with-deps chromium

      - name: Tests e2e
        run: pnpm test:e2e

      - name: Conserver traces et captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-admin
          path: apps/admin/test-results/
          retention-days: 7
          if-no-files-found: ignore
